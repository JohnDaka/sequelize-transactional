name: ci

# Only what lands in main: pull requests are checked locally before they are opened.
on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # A real Postgres for src/postgres.spec.ts: commit, rollback, nesting and now() as they run.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The specs, Postgres's included, failing below full coverage.
      - run: pnpm test:coverage
      - run: pnpm build
